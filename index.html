   <div class="cd-head"><span>ระยะเวลาพำนักผ่านไป ${pct}%</span><span class="cd-zl">ช่วงยื่นต่ออายุ</span></div>
   <div class="cd-track"><i class="cd-zone" style="width:${zone}%"></i><i class="cd-fill" style="width:${pct}%"></i><i class="cd-knob" style="left:${pct}%"></i></div>
   <div class="cd-foot"><span>เริ่ม ${fd(p.stayStart)}</span><span>หมดอายุ ${fd(p.expiry)}</span></div>
  </div>
  <div class="vc-meta">${ic("cal", 16)}<span>รายงานตัว 90 วัน <b>${fd(p.report90)}</b> (${inDays(days(p.report90))})</span></div></div>
 <div style="padding:16px">
 <div class="alert ${a.c === "red" ? "urgent" : a.c}"><div class="ai">${ic(a.i)}</div><div class="sp"><b>${a.t}</b><p>${a.m}</p>${a.b ? `<button class="btn btn-primary btn-sm" onclick="openSvc('${a.svc}')">${a.b} ${ic("chev", 16)}</button>` : ""}</div></div>
 <div class="sec-title">บริการ <a onclick="tab('select')">ดูทั้งหมด</a></div>
 <div class="grid">${quick
   .map((id) => {
     const s = SV[id];
     const r = p.rec.includes(id) && !doneOf(id);
     return `<button class="tile" onclick="openSvc('${id}')">${r ? '<span class="badge b-blue">แนะนำ</span>' : ""}<span class="ti ${s.c}">${ic(s.ic)}</span>${s.short}</button>`;
   })
   .join("")}
  <button class="tile" onclick="tab('select')"><span class="ti c-navy">${ic("grid")}</span>บริการทั้งหมด</button></div>
 ${act.length ? `<div class="sec-title">กำลังดำเนินการ <a onclick="tab('track')">ดูทั้งหมด</a></div>${act.map((r) => `<button class="svc" onclick="tab('track')"><span class="ri ${SV[r.svc].c}">${ic(SV[r.svc].ic)}</span><span class="rt"><b>${SV[r.svc].name}</b><small>${r.steps[r.step - 1]} · ${r.id}</small></span>${ic("chev", 18)}</button>`).join("")}` : ""}
 <div class="sec-title">กำหนดการ <a onclick="tab('track')">ดูทั้งหมด</a></div>
 <div class="card" style="padding:2px 14px"><ul class="tl">${timeline().slice(0, 3).map(tlItem).join("")}</ul></div>
 <div class="sec-title">ผู้ช่วยตอบคำถาม</div>
 <button class="card" style="width:100%;display:flex;gap:12px;align-items:center" onclick="openHelp('ai','diff')"><span class="ri c-blue" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center">${ic("spark")}</span><span class="sp"><b style="font-size:14.5px;display:block">รายงานตัว 90 วัน ต่อวีซ่า และ Re-entry ต่างกันอย่างไร</b></span>${ic("chev", 18)}</button>
 </div></div>${nav("home")}`;
      };
      /** แถวไทม์ไลน์ 1 รายการ (ใช้ทั้งหน้า Home และ Track) — สีป้าย: ≤7 วัน แดง, ≤30 วัน ส้ม */
      function tlItem(x) {
        const d = D(x.d),
          n = days(x.d);
        const u = n <= 7 ? "b-red" : n <= 30 ? "b-amber" : "b-gray";
        return `<li class="${x.done ? "done" : ""}"><div class="dd"><b>${d.getDate()}</b><small>${TH_M[d.getMonth()]}</small></div><div class="tt"><b>${x.t}</b><small>${x.s || ""}</small></div>${x.done ? `<span class="badge b-green">เสร็จแล้ว</span>` : `<span class="badge ${u}">${inDays(n)}</span>`}</li>`;
      }

      /* ---------- หน้า SELECT : เลือกบริการ กรองตามสถานการณ์ แยก "แนะนำ" กับ "ทั้งหมด" ---------- */
      SCREENS.select = () => {

 <div class="sec-title">ความแตกต่างของบริการ</div>
 <div class="card"><div class="cmp">
  <div class="c-blue"><b>รายงานตัว 90 วัน</b>แจ้งว่ายังพำนักที่อยู่เดิม ไม่ใช่การขยายวีซ่า</div>
  <div class="c-blue"><b>ต่ออายุวีซ่า</b>ขยายระยะเวลาพำนักในประเทศไทย</div>
  <div class="c-blue"><b>Re-entry Permit</b>คงสถานะวีซ่าเมื่อเดินทางกลับเข้าประเทศ</div></div>
  <button class="btn btn-ghost btn-sm mt12" style="width:100%" onclick="openHelp('ai')">${ic("spark", 18)} ถามผู้ช่วย AI</button></div>
 </div>${nav("select")}`;

      /* ---------- หน้า FORM : รายละเอียดบริการ (สิทธิ์, ขั้นตอน, เอกสาร) + แบบฟอร์ม ---------- */
      /** สร้างช่องกรอก 1 ช่องตาม f.type (select / textarea / chips / input) พร้อม error, hint, ตัวอย่าง */
      function field(f) {
        const v = S.form[f.id] ?? "",
          e = S.errors[f.id];
        let inp;
        if (f.type === "select")
          inp = `<select onchange="setF('${f.id}',this.value)">${f.opts.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
        else if (f.type === "textarea")
          inp = `<textarea rows="3" placeholder="${f.ph || ""}" oninput="setF('${f.id}',this.value)">${esc(v)}</textarea>`;
        else if (f.type === "chips")
          inp = `<div class="seg">${f.opts.map((o) => `<button class="${o.v === v ? "on" : ""}" onclick="setF('${f.id}','${o.v}');render()"><b>${o.l}</b><small>${o.s}</small></button>`).join("")}</div>`;
        else
          inp = `<input type="${f.type || "text"}" value="${esc(v)}" placeholder="${f.ph || ""}" oninput="setF('${f.id}',this.value)">`;
        return `<div class="field ${e ? "err" : ""}" id="w_${f.id}"><label>${f.l}${f.req ? " <i>*</i>" : ""}</label>${inp}${e ? `<div class="errmsg">${ic("alert", 14)} ${e}</div>` : ""}${f.ex ? `<div class="ex"><b>ตัวอย่าง</b>${f.ex}</div>` : ""}${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div>`;
      }
      /** ข้อความสองภาษา (ไทย/อังกฤษ) ขอให้เจ้าของที่พักแจ้ง ตม.30 — เติมข้อมูลจากฟอร์มอัตโนมัติ */
      function tm30Msg() {
        const f = S.form,
          p = S.p;
        const a = f.newAddress || "(ที่อยู่ใหม่)",
          o = f.ownerName || "(ชื่อเจ้าของที่พัก)",
          d = f.moveIn || iso8(TODAY);
        return {
          th: `เรียน คุณ${o}\nดิฉัน/ผม ${p.name} สัญชาติ${p.nat} หนังสือเดินทางเลขที่ ${p.passport} ได้ย้ายเข้าพักที่ ${a} ตั้งแต่วันที่ ${fd(d)} รบกวนช่วยแจ้งที่พักคนต่างด้าว (ตม.30) ภายใน 24 ชั่วโมง ขอบคุณค่ะ/ครับ`,
          en: `Dear ${f.ownerName || "(owner name)"},\nI, ${p.name} (${p.natEn}, passport no. ${p.passport}), moved in to ${f.newAddress || "(new address)"} on ${fde(d)}. Could you kindly submit the TM.30 notification within 24 hours? Thank you.`,
        };
      }
      /** อัปเดตกล่องข้อความ ตม.30 ขณะพิมพ์ โดยไม่ render ทั้งหน้า */
      function updMsg() {

      /** เนื้อหามี 3 แบบ: (1) มีคำขอค้างอยู่  (2) ยังไม่มีสิทธิ์ยื่น  (3) ปกติ → แสดงรายละเอียด + ฟอร์ม */
      SCREENS.form = () => {
        const s = SV[S.svc],
          p = S.p,
          e = elig(S.svc),
          fs = s.fields(p),
          r = reqOf(S.svc);

          S.svc === "reentry" ? (S.form.type === "multiple" ? "3,800 บาท" : "1,000 บาท") : s.fee;

          const d = DOCS[k];
          return d.auto || p.wallet.includes(k) || d.opt;
        }).length;
        let body;
        if (r)
          body = `<div class="alert blue mt12"><div class="ai">${ic("clock")}</div><div><b>มีคำขอนี้อยู่ระหว่างดำเนินการ</b><p>${r.id} · ${r.steps[r.step - 1]}</p><button class="btn btn-primary btn-sm" onclick="tab('track')">ติดตามสถานะ</button></div></div>`;
        else if (!e.ok)
          body = `<div class="alert ${e.soon ? "amber" : "red"} mt12"><div class="ai">${ic("alert")}</div><div><b>${e.t}</b><p style="white-space:pre-line">${e.m}</p><div class="flex" style="flex-wrap:wrap;gap:8px;margin-top:10px">${e.soon ? `<button class="btn btn-primary btn-sm" onclick="toast('ตั้งค่าการแจ้งเตือนแล้ว')">${ic("bell", 16)} แจ้งเตือนเมื่อถึงกำหนด</button>` : ""}<button class="btn btn-line btn-sm" onclick="openHelp('staff')">ติดต่อเจ้าหน้าที่</button></div></div></div>`;
        else
          body = `${e.t ? `<div class="alert green mt12"><div class="ai">${ic("shield")}</div><div><b>${e.t}</b><p>${e.m}</p></div></div>` : ""}
  <div class="card flex mt12" style="align-items:flex-start"><span style="color:var(--navy)">${ic("clock")}</span><span style="font-size:14px">${s.when}</span></div>
  <div class="sec-title">ขั้นตอน</div><div class="card"><ol class="steps">${s.steps.map((t, i) => `<li class="${i === 0 ? "done" : i === 1 ? "now" : ""}">${t}</li>`).join("")}</ol></div>
  <div class="sec-title">เอกสารที่ต้องใช้ <span class="badge ${ready === s.docs.length ? "b-green" : "b-amber"}">พร้อม ${ready}/${s.docs.length}</span></div>
  <div class="card" style="padding:4px 16px">${s.docs
    .map((k) => {

      /* ---------- หน้า CHECK : ตรวจเอกสารครบไหม + ความสอดคล้องข้อมูล + สรุป + ยอมรับเงื่อนไข ----------

 <div class="card mt12"><div class="check ${S.agree ? "on" : ""}" onclick="S.agree=!S.agree;render()"><span class="box">${S.agree ? ic("check", 16) : ""}</span><span>ข้าพเจ้าขอยืนยันว่าข้อมูลและเอกสารถูกต้องตามความเป็นจริง</span></div></div>
 </div>
 <div class="footer-cta">${!allOK ? `<div class="note">ยังขาดเอกสาร ${miss} รายการ</div>` : !S.agree ? `<div class="note">กรุณายืนยันความถูกต้องของข้อมูล</div>` : ""}<button class="btn btn-primary" ${allOK && S.agree ? "" : "disabled"} onclick="submit()">${S.svc === "tm30" ? "ส่งข้อความถึงเจ้าของที่พัก" : "ยืนยันและยื่นคำขอ"}</button></div>`;

      /* ---------- หน้า TRACK : คำขอของฉัน + ไทม์ไลน์การพำนัก + ตั้งค่าแจ้งเตือน + นัดหมาย ตม. ---------- */
      SCREENS.track = () => {

 <div class="content">
 <div class="sec-title" style="margin-top:4px">คำขอของฉัน</div>
 ${
   rs.length
     ? rs
         .map((r) => {
           const s = SV[r.svc];
           return `<div class="card" style="margin-bottom:10px"><div class="flex"><span class="ri ${s.c}" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center">${ic(s.ic, 20)}</span><div class="sp"><b style="font-size:14.5px;display:block;line-height:1.3">${s.name}</b><span class="muted">${r.id}</span></div>${r.done ? '<span class="badge b-green">เสร็จสิ้น</span>' : '<span class="badge b-blue">กำลังดำเนินการ</span>'}</div>

 }
 <div class="sec-title">กำหนดการสำคัญ</div>

 <div class="card" style="padding:4px 16px">${[

 ]

 <div class="sec-title">นัดหมาย ตม.</div>
 <div class="card">${

  <div class="slots">${wd
    .map((x) => {
      const y = D(x);
      return `<button class="slot ${S.apDate === x ? "on" : ""}" onclick="S.apDate='${x}';render()">${DOW[y.getDay()]}<b>${y.getDate()}</b>${TH_M[y.getMonth()]}</button>`;
    })
    .join("")}</div>
  <div class="times">${["09:00", "10:30", "13:30", "15:00"].map((t, i) => `<button class="${S.apTime === t ? "on" : ""}" ${i === 1 && S.apDate === wd[0] ? "disabled" : ""} onclick="S.apTime='${t}';render()">${t}</button>`).join("")}</div>
  <button class="btn btn-primary btn-sm" style="width:100%;height:44px" onclick="book()">ยืนยันนัดหมาย</button>`
 }</div>

      /* ==================================================================

       * ================================================================== */
      function showModal() {

          w = document.getElementById("modalwrap");
        w.innerHTML = `<div class="scrim"></div><div class="modal"><div class="mi">${ic("check", 38)}</div><h3>${m.svc === "tm30" ? "ส่งข้อความเรียบร้อย" : "ยื่นคำขอสำเร็จ"}</h3><p>${s.name}</p>
 <div class="refno">หมายเลขอ้างอิง<b>${m.id}</b></div>
  <button class="btn btn-primary mt16" onclick="closeModal('track')">ติดตามสถานะ</button><button class="btn mt8" style="color:var(--ink-2)" onclick="closeModal('home')">กลับหน้าหลัก</button></div>`;
        w.classList.add("show");
      }
      /** ปิด modal ล้างบริการที่ทำอยู่ แล้วไปแท็บที่ระบุ */
      function closeModal(to) {

      /* ==================================================================
       * 11. HELP SHEET — ช่วยเหลือ 3 แท็บ: ผู้ช่วย AI (จำลอง) / คู่มือ / คุยกับเจ้าหน้าที่
       *
       * QA = คำถาม-คำตอบสำเร็จรูป ผู้ช่วย AI จับคำสำคัญในคำถามแล้วเลือกคำตอบจากที่นี่
       * ================================================================== */
      const QA = {
        diff: {
          q: "รายงานตัว 90 วัน ต่อวีซ่า และ Re-entry ต่างกันอย่างไร?",
          a: "• รายงานตัว 90 วัน: แจ้งว่ายังพักอยู่ที่อยู่เดิม ทำทุก 90 วัน ไม่ได้ขยายวีซ่า\n• ต่ออายุวีซ่า: ขยายระยะเวลาที่อยู่ในไทย ต้องทำก่อนวีซ่าหมดอายุ\n• Re-entry: ขออนุญาตก่อนออกนอกประเทศ เพื่อให้วีซ่าเดิมยังใช้ได้เมื่อกลับมา",
        },
        reentry: {
          q: "ถ้าออกนอกประเทศโดยไม่ขอ Re-entry จะเป็นอย่างไร?",
          a: "การอนุญาตให้พำนักและวีซ่าเดิมจะสิ้นสุดทันทีเมื่อออกจากไทย คุณจะต้องขอวีซ่าใหม่ก่อนกลับเข้ามา จึงควรขอ Re-entry ให้เรียบร้อยก่อนวันเดินทาง",
        },
        move: {
          q: "ย้ายที่พักใหม่ต้องทำอะไรบ้าง?",
          a: 'เจ้าของที่พักต้องแจ้ง ตม.30 ภายใน 24 ชั่วโมงหลังคุณย้ายเข้า คุณใช้บริการ "แจ้งที่พัก (ตม.30)" เพื่อสร้างข้อความสองภาษาส่งให้เจ้าของที่พักได้ทันที',
        },
        when: {
          q: "ควรเริ่มเตรียมต่อวีซ่าเมื่อไร?",
          a: "แนะนำให้เริ่มเตรียม 30 วันก่อนวีซ่าหมดอายุ โดยเฉพาะหนังสือรับรองจากมหาวิทยาลัยซึ่งอาจใช้เวลา 3–5 วันทำการ ขอผ่านแอปได้ในขั้นตอนตรวจเอกสาร",
        },
      };
      /** เปิด Help sheet ที่แท็บ t — ถ้าส่ง q (key ของ QA) มาด้วย จะถามคำถามนั้นให้อัตโนมัติ */
      function openHelp(t = "ai", q) {
        S.help.open = true;
        S.help.tab = t;
        renderSheet();
        if (q) ask(q);
      }
      function closeHelp() {
        S.help.open = false;
        renderSheet();
      }
      /**
       * ถามผู้ช่วย AI: k = key ของ QA (กดชิปคำถาม) หรือ free = ข้อความที่พิมพ์เอง
       * แสดงจุด "กำลังพิมพ์" 0.7 วินาทีก่อนตอบ
       */
      function ask(k, free) {
        const h = S.help;
        let a;
        if (free) {
          h.chat.push({ me: 1, t: free });
          const s = free.toLowerCase();
          a =
            /90/.test(s) && /(ต่อ|extend)/.test(s)
              ? QA.diff.a
              : /re-?entry|ออกนอก|กลับบ้าน/.test(s)
                ? QA.reentry.a
                : /ย้าย|ตม\.?30|tm\.?30|ที่พัก/.test(s)
                  ? QA.move.a
                  : /ต่อ|หมดอายุ|extend/.test(s)
                    ? QA.when.a
                    : /90/.test(s)
                      ? QA.diff.a
                      : 'ขอบคุณสำหรับคำถาม ต้นแบบนี้ตอบได้เฉพาะคำถามตัวอย่าง หากต้องการคำตอบเฉพาะกรณี กรุณาเลือกแท็บ "เจ้าหน้าที่" เพื่อติดต่อเจ้าหน้าที่';
        } else {
          h.chat.push({ me: 1, t: QA[k].q });
          a = QA[k].a;
        }
        h.typing = true;
        renderSheet();
        setTimeout(() => {
          h.typing = false;
          h.chat.push({ t: a });
          renderSheet();
        }, 700);

  ${
    !h.typing

          .filter((k) => !h.chat.some((m) => m.t === QA[k].q))

          .join("")}</div>`
      : ""
  }
  <p class="muted" style="font-size:11.5px;text-align:center">คำตอบเป็นข้อมูลจำลองเพื่อการสาธิต</p>`;
          foot = `<div class="sheet-f"><input id="ask" placeholder="พิมพ์คำถาม…" onkeydown="if(event.key==='Enter')sendFree()"><button class="send" onclick="sendFree()" aria-label="ส่ง">${ic("send", 20)}</button></div>`;
        } else if (h.tab === "guide") {
          body = `<div class="card"><b style="display:block;margin-bottom:4px">หน้าที่ระหว่างพำนักในประเทศไทย</b>
  ${[
    [
      "แจ้งที่พัก (ตม.30)",
      "ทุกครั้งที่ย้ายที่พัก เจ้าของที่พักต้องแจ้งภายใน 24 ชั่วโมง",
    ],
    [
      "รายงานตัวทุก 90 วัน",
      "นับจากวันเข้าประเทศครั้งล่าสุด ยื่นได้ตั้งแต่ 15 วันก่อน ถึง 7 วันหลังครบกำหนด",
    ],
    ["ต่ออายุวีซ่า", "ยื่นก่อนวีซ่าหมดอายุ"],
    ["Re-entry Permit", "ต้องขอก่อนเดินทางออกนอกประเทศทุกครั้ง"],
    ["TDAC", "กรอกภายใน 3 วันก่อนเดินทางถึงประเทศไทย"],
  ]
    .map(
      ([a, b]) =>
        `<details class="acc"><summary>${a}${ic("chev", 18)}</summary><p>${b}</p></details>`,
    )
    .join("")}</div>
  <div class="sec-title">ศูนย์ความรู้</div>
  ${[
    ["ED กับ ED Plus ต่างกันอย่างไร", "book"],
    ["ตัวอย่างการกรอกแบบ ตม.7", "doc"],
    ["เตรียมเอกสารจากมหาวิทยาลัย", "school"],
  ]
    .map(

        } else {

  ${
    queued
      ? `<div class="alert green"><div class="ai">${ic("check")}</div><div><b>อยู่ในคิวลำดับที่ 3</b><p>เวลารอโดยประมาณ 5 นาที · เจ้าหน้าที่จะเห็นข้อมูลวีซ่าของคุณโดยไม่ต้องอธิบายซ้ำ</p></div></div>`
      : `<div class="card"><div class="field"><label>เรื่องที่ต้องการปรึกษา</label><select id="topic">${["ต่ออายุวีซ่า", "รายงานตัว 90 วัน", "แจ้งที่พัก ตม.30", "Re-entry Permit", "อื่น ๆ"].map((o) => `<option>${o}</option>`).join("")}</select></div>
   <div class="field"><label>ภาษาที่ต้องการ</label><select><option>ไทย</option><option>English</option><option>中文</option></select></div>
   <button class="btn btn-primary" onclick="S.help.chat.push({staff:1,sys:1,t:'เชื่อมต่อเจ้าหน้าที่แล้ว · เรื่อง '+document.getElementById('topic').value});renderSheet();toast('ส่งต่อเจ้าหน้าที่แล้ว')">เริ่มแชทกับเจ้าหน้าที่</button></div>`
  }
  <div class="card mt12 flex"><span style="color:var(--navy)">${ic("clock")}</span><span class="muted">เวลาทำการ จ.–ศ. 08:30–16:30 น. (ข้อมูลจำลอง)</span></div>`;
        }
        w.innerHTML = `<div class="scrim" onclick="closeHelp()"></div><div class="sheet"><div class="sheet-h"><div class="grab"></div><div class="sheet-top"><h3>ช่วยเหลือ</h3><button class="iconbtn" onclick="closeHelp()" aria-label="ปิด">${ic("x")}</button></div>
 <div class="tabs">${[
   ["ai", "ผู้ช่วย AI"],
   ["guide", "คู่มือ"],
   ["staff", "เจ้าหน้าที่"],
 ]
   .map(
     ([k, l]) =>
       `<button class="${h.tab === k ? "on" : ""}" onclick="S.help.tab='${k}';renderSheet()">${l}</button>`,
   )
   .join("")}</div></div>
 <div class="sheet-b" id="sb_body">${body}</div>${foot}</div>`;
        w.classList.add("show");
        const b = document.getElementById("sb_body");
        if (b && h.tab === "ai") b.scrollTop = b.scrollHeight;
